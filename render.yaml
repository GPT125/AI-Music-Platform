services:
  - type: web
    name: santoor-ai-learning-platform
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: santoor-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://santoor-ai-learning-platform.onrender.com
      - key: UPLOAD_MAX_MB
        value: "25"
      - key: STORAGE_DIR
        value: /app/backend/storage
      - key: SOUNDFONT_BASE_URL
        value: https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/
      - key: OMR_AUDIVERIS_PATH
        sync: false
      - key: OMR_HOMR_PATH
        sync: false
      - key: OMR_OEMER_PATH
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: santoor-ai-postgres
    databaseName: santoor_ai
    user: santoor_ai
    plan: free

