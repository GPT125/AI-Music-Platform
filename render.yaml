services:
  - type: web
    name: santoor-ai-learning-platform
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: santoor-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-music-platform-qvjc.onrender.com
      - key: APP_BASE_URL
        value: https://ai-music-platform-qvjc.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ai-music-platform-qvjc.onrender.com/api/auth/google/callback
      - key: UPLOAD_MAX_MB
        value: "25"
      - key: STORAGE_DIR
        value: /app/backend/storage
      - key: SOUNDFONT_BASE_URL
        value: https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/
      - key: SANTOOR_SAMPLE_BASE_URL
        sync: false
      - key: VITE_SOUNDFONT_BASE_URL
        value: https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/
      - key: VITE_SANTOOR_SAMPLE_BASE_URL
        sync: false
      - key: OMR_AUDIVERIS_PATH
        sync: false
      - key: OMR_HOMR_PATH
        sync: false
      - key: OMR_OEMER_PATH
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: santoor-ai-postgres
    databaseName: santoor_ai
    user: santoor_ai
    plan: free
